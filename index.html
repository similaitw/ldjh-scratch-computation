<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>算衍修仙錄：積木計算篇（宜蘭競賽 Blockly 版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1420; --panel:#122030; --panel2:#182a3c; --gold:#e3c27a; --gold-d:#8f7340;
  --ink:#f2ead8; --mute:#a8b2b4; --ok:#7fe0bf; --bad:#ef7f72; --jade:#7fe0bf;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);
  background:radial-gradient(ellipse at 50% -10%,#24455a 0%,#0b1420 55%) fixed,#0b1420;
  font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.65}
button{font:inherit;cursor:pointer}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 18px;
  background:linear-gradient(180deg,rgba(8,14,22,.92),rgba(8,14,22,.7));border-bottom:1px solid rgba(227,194,122,.45);
  box-shadow:0 1px 0 rgba(127,224,191,.15)}
.brand{display:flex;align-items:baseline;gap:10px}
.logo{font-family:var(--serif);font-size:1.6rem;font-weight:900;letter-spacing:.18em;
  background:linear-gradient(180deg,#fff3cf,#e3c27a 55%,#a67f3a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.brand small{color:var(--mute);letter-spacing:.1em}
.status{display:flex;align-items:center;gap:10px;flex:1;min-width:240px}
.badge{font-family:var(--serif);font-weight:900;color:#1a1306;padding:2px 14px;white-space:nowrap;
  background:linear-gradient(180deg,#f3dc9c,#c9a24d);border-radius:999px;box-shadow:0 0 12px rgba(227,194,122,.35)}
.xpbar{flex:1;height:8px;background:rgba(0,0,0,.5);border:1px solid rgba(227,194,122,.4);border-radius:999px;min-width:80px;overflow:hidden}
.xpbar>div{height:100%;background:linear-gradient(90deg,#3fb393,#bff7e6);width:0;transition:width .5s;box-shadow:0 0 10px #7fe0bf}
.xptext{color:var(--mute);font-size:.85rem;white-space:nowrap}
nav{display:flex;gap:8px}
.btn{background:linear-gradient(180deg,#f0d896,#c49a45);color:#1a1306;border:1px solid #6b5220;border-radius:4px;
  box-shadow:0 2px 0 #5a4218,0 0 0 1px rgba(255,240,200,.25) inset;padding:6px 16px;font-weight:700;letter-spacing:.05em}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #5a4218}
.btn.ghost{background:rgba(127,224,191,.06);color:var(--ink);border-color:rgba(127,224,191,.45);box-shadow:none}
.btn.small{padding:3px 12px;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{max-width:1100px;margin:0 auto;padding:16px}
#mapWrap{position:relative;overflow:hidden;border-radius:10px;border:1px solid rgba(227,194,122,.5);
  box-shadow:0 0 0 4px rgba(11,20,32,.9),0 0 0 5px rgba(227,194,122,.25),0 20px 50px rgba(0,0,0,.55);background:#16283a}
#scene3d{width:100%;height:560px;line-height:0}
#scene3d canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;font-family:var(--serif);font-weight:900;
  font-size:17px;letter-spacing:.12em;color:#fff7e2;text-shadow:0 0 8px rgba(0,0,0,.9),0 2px 3px rgba(0,0,0,.9);transition:transform .15s}
.lbl small{display:block;font-family:system-ui,sans-serif;font-size:12px;font-weight:700;letter-spacing:.05em;color:#f0cf7c}
.lbl.locked{color:#c3ccd3}.lbl.locked small{color:#aab4bd}
.lbl.done small{color:#8ff5d6}
.lbl.hot{transform:translate(-50%,-100%) scale(1.15)}
#fallback{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;background:rgba(8,14,22,.85);line-height:1.6}
#fallback p{margin:0 0 6px;color:var(--mute)}
.hint{color:var(--mute);font-size:.9rem;text-align:center;margin:12px 0 0}
footer{text-align:center;padding:8px 0 24px;font-size:.8rem}
footer a{color:var(--mute)}
#overlay{position:fixed;inset:0;background:rgba(4,8,14,.66);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
#overlay.hidden{display:none}
.panel{background:linear-gradient(180deg,rgba(20,36,52,.97),rgba(12,22,34,.97));border:1px solid rgba(227,194,122,.7);border-radius:8px;
  box-shadow:0 0 0 4px rgba(12,22,34,.9),0 0 0 5px rgba(127,224,191,.25),0 24px 60px rgba(0,0,0,.6);
  width:min(780px,100%);max-height:92vh;overflow:auto;padding:20px 22px;position:relative}
.panel h2{margin:0 0 4px;color:var(--gold);font-size:1.5rem;font-family:var(--serif);letter-spacing:.12em}
.panel h3{margin:18px 0 8px;color:var(--gold);font-size:1.08rem;font-family:var(--serif);letter-spacing:.06em}
.sub{color:var(--mute);margin:0 0 12px}
.close{position:absolute;top:12px;right:14px}
.dialog{background:rgba(5,10,18,.7);border:1px solid rgba(227,194,122,.5);border-radius:6px;padding:14px 18px;min-height:110px;font-family:var(--serif);font-size:1.05rem}
.speaker{color:var(--jade);font-weight:900;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.quest{background:var(--panel2);border:1px solid rgba(168,178,180,.18);border-left:4px solid var(--mute);border-radius:4px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.quest .info{flex:1;min-width:200px}
.quest .name{font-weight:700;font-family:var(--serif)}
.quest.done{border-left-color:var(--ok)}
.quest.locked{opacity:.5}
.tag{display:inline-block;font-size:.75rem;padding:0 6px;margin-right:6px;border:1px solid currentColor;border-radius:3px}
.tag.main{color:var(--gold)} .tag.side{color:#9cc4ff} .tag.extra{color:#e7a8f2} .tag.boss{color:var(--bad)}
.spec{background:rgba(5,10,18,.6);border:1px dashed rgba(227,194,122,.5);border-radius:4px;padding:10px 12px}
table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{border:1px solid rgba(168,178,180,.22);padding:6px 8px;text-align:left;vertical-align:middle}
th{background:rgba(5,10,18,.6);color:var(--mute);font-weight:600}
input[type=text],textarea{font:inherit;background:rgba(3,7,12,.8);color:var(--ink);border:1px solid rgba(168,178,180,.35);border-radius:4px;padding:5px 8px;width:100%}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(227,194,122,.2)}
td input[type=text]{min-width:64px}
.multi{display:flex;gap:6px;flex-wrap:wrap}
.multi label{display:flex;flex-direction:column;font-size:.75rem;color:var(--mute);width:72px}
.mark{font-weight:800;font-size:1.1rem;width:28px;text-align:center}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
.msg{margin-top:10px;padding:8px 12px;border:1px solid;border-radius:4px}
.msg.ok{border-color:var(--ok);color:var(--ok)} .msg.bad{border-color:var(--bad);color:var(--bad)} .msg.info{border-color:var(--gold-d);color:var(--gold)}
.field{margin:10px 0}
.field label{display:block;color:var(--mute);font-size:.9rem;margin-bottom:4px}
.stat{display:grid;grid-template-columns:52px 1fr 32px;gap:8px;align-items:center;margin:6px 0}
.stat .bar{height:8px;background:rgba(0,0,0,.5);border-radius:999px;overflow:hidden}
.stat .bar>div{height:100%;background:linear-gradient(90deg,#c49a45,#f3dc9c)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--jade);color:var(--jade);padding:0 10px;border-radius:999px;font-size:.85rem}
.scroll{background:linear-gradient(180deg,#f3e6c6,#e6d3a8);color:#3a2a14;border:1px solid #8a6d2f;border-radius:4px;padding:10px 16px;margin:10px 0;font-family:var(--serif)}
.scroll h4{margin:0 0 6px}
.scroll ul{margin:0;padding-left:20px}
.scroll.lock{background:var(--panel2);color:var(--mute);border-color:rgba(168,178,180,.25)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(8,14,22,.95);border:1px solid var(--gold);border-radius:6px;padding:8px 18px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
#burst{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:40;
  background:radial-gradient(circle,rgba(255,236,170,.45),rgba(127,224,191,.18) 30%,rgba(4,8,14,.94) 65%);opacity:0;pointer-events:none;transition:opacity .5s}
#burst.show{opacity:1;pointer-events:auto}
#burst .big{font-family:var(--serif);font-size:clamp(2.2rem,8vw,4rem);font-weight:900;color:#fff3cf;text-shadow:0 0 24px #f3d27a,0 0 48px #7fe0bf;letter-spacing:.25em;animation:pulse 1.4s ease-in-out infinite}
#burst .small{color:var(--ink);margin-top:12px;font-size:1.1rem;font-family:var(--serif);text-align:center;padding:0 16px}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (max-width:600px){.panel{padding:16px 12px}.logo{font-size:1.25rem}.lbl{font-size:14px}}

#forge{position:fixed;inset:0;z-index:20;display:grid;grid-template-rows:auto 1fr;background:#0b1420}
#forge.hidden{display:none}
.fg-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;background:rgba(8,14,22,.95);border-bottom:1px solid rgba(227,194,122,.45)}
.fg-title{flex:1;min-width:200px;font-family:var(--serif);font-size:1.15rem;color:var(--gold)}
.modesw{display:inline-flex;border:1px solid rgba(227,194,122,.6);border-radius:999px;overflow:hidden}
.modesw button{border:0;background:transparent;color:var(--ink);padding:4px 12px;font-size:.9rem}
.modesw button.on{background:var(--gold);color:#1a1306;font-weight:700}
.fg-title .sub{font-family:system-ui,sans-serif;font-size:.85rem;margin:0 0 0 10px}
.fg-body{display:grid;grid-template-columns:minmax(300px,360px) 1fr 300px;min-height:0}
#forge.noguide .fg-body{grid-template-columns:0 1fr 300px}
#forge.noguide .fg-guide{display:none}
.fg-guide{overflow:auto;padding:12px 14px;border-right:1px solid rgba(227,194,122,.25);background:rgba(18,32,48,.9)}
.fg-guide .blockbox{overflow-x:auto}
.fg-ws{position:relative;min-height:0;background:#f9f9f9}
#fgWs{position:absolute;inset:0}
#fgLoading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#555;font-size:1.1rem;background:#f9f9f9;z-index:2}
.fg-side{overflow:auto;padding:12px 14px;border-left:1px solid rgba(227,194,122,.25);background:rgba(18,32,48,.9)}
.fg-side h4{font-family:var(--serif);color:var(--gold);margin:16px 0 4px;font-size:1.05rem}
.fg-stage{position:relative;height:190px;border-radius:8px;border:1px solid rgba(227,194,122,.45);overflow:hidden;
  background:linear-gradient(180deg,#2c5a72 0%,#93bcbf 60%,#e9dcbc 100%)}
.fg-hero{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:84px}
.fg-bubble{position:absolute;left:12px;right:12px;top:10px;background:#fff;color:#222;border-radius:14px;padding:6px 12px;font-size:1rem;font-weight:700;
  box-shadow:0 2px 0 rgba(0,0,0,.25);word-break:break-all;max-height:80px;overflow:auto;text-align:center}
.fg-bubble::after{content:'';position:absolute;left:50%;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
#fgAsk{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;background:rgba(255,255,255,.95);border-radius:20px;padding:4px 6px}
#fgAsk input{border:0;background:transparent;color:#222;flex:1;min-width:0}
#fgAsk button{border:0;border-radius:50%;width:30px;height:30px;background:#4cbfe6;color:#fff;font-weight:900}
.fg-run{position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#7fe0bf;box-shadow:0 0 8px #7fe0bf;display:none}
.fg-run.on{display:block}
.fg-vars{margin-top:10px;font-size:.85rem}
#fgIn{width:100%;font:inherit;font-size:.95rem;border-radius:6px;border:1px solid rgba(227,194,122,.45);background:rgba(5,10,18,.6);color:var(--ink);padding:6px 8px;margin-bottom:6px}
.fg-outtext{white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:4px}
.blocklyToolboxDiv,.blocklyToolbox,.blocklyFlyout,.blocklyWidgetDiv,.blocklyDropDownDiv{color:#222}
.blocklyTreeLabel,.blocklyToolboxCategoryLabel{color:#333}
#panel a,.fg-guide a{color:var(--jade)}
.bkbox{background:#fff;border-radius:8px;margin:6px 0;overflow-x:auto;overflow-y:hidden;min-height:30px}
.bkbox .injectionDiv{border-radius:8px}
.bkbox.err{color:#a33;padding:6px;font-size:.85rem}
.icttbl td{vertical-align:top}
.fg-log{margin-top:10px;font-size:.85rem;background:rgba(0,0,0,.25);border-radius:6px;padding:6px 10px;max-height:140px;overflow:auto}
.fg-log b{color:var(--mute);font-weight:600}
.fg-log ol{margin:4px 0 0;padding-left:22px}
.fg-log li.q{color:var(--mute)}
.fg-log li.q::before{content:'問：'}
.fg-vars span{display:inline-block;margin:2px 4px 2px 0;padding:1px 8px;border-radius:999px;background:#ff8c1a;color:#fff}
.fg-res table{font-size:.85rem}
.fg-res td,.fg-res th{padding:4px 6px}
#fgModal{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(4,8,14,.55)}
#fgModal[hidden]{display:none}
#fgModal .panel{width:min(380px,92vw)}
@media (max-width:1000px){
  #forge{overflow:auto;display:block}
  .fg-body{display:block}
  .fg-guide{max-height:none;border-right:0}
  #forge:not(.showguide) .fg-guide{display:none}
  #forge.noguide .fg-guide{display:none}
  .fg-ws{height:62vh}
  .fg-side{border-left:0}
}

.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0}
.world{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid rgba(227,194,122,.45);background:rgba(5,10,18,.55);color:var(--ink);cursor:pointer;position:relative}
.world b{font-family:var(--serif);font-size:1.15rem;color:var(--gold)}
.world span{font-weight:700}
.world small{color:var(--mute)}
.world em{position:absolute;top:8px;right:10px;font-style:normal;font-size:.75rem;color:var(--jade)}
.world.on{border-color:var(--jade);box-shadow:0 0 0 2px rgba(127,224,191,.25)}
body[data-theme=magic]{--bg:#0e0b1d;--panel:#1a1530;--panel2:#221b3d;--gold:#ecc979;--gold-d:#8c7140;--jade:#b9a6ff;--ok:#9fe7a8;--mute:#aba5bf}
body[data-theme=magic],body[data-theme=magic] html{background:radial-gradient(ellipse at 50% -10%,#3b2a63 0%,#0e0b1d 55%) fixed,#0e0b1d}
body[data-theme=magic] .panel{background:linear-gradient(180deg,rgba(30,24,54,.97),rgba(16,12,30,.97));box-shadow:0 0 0 4px rgba(16,12,30,.9),0 0 0 5px rgba(185,166,255,.3),0 24px 60px rgba(0,0,0,.6)}
body[data-theme=magic] .xpbar>div{background:linear-gradient(90deg,#7a5cff,#e2d8ff);box-shadow:0 0 10px #b9a6ff}
body[data-theme=magic] .top{background:linear-gradient(180deg,rgba(14,10,28,.94),rgba(14,10,28,.72))}
body[data-theme=magic] #mapWrap{background:#1a1533}
body[data-theme=magic] .fg-guide,body[data-theme=magic] .fg-side{background:rgba(30,24,54,.92)}
body[data-theme=magic] #forge{background:#0e0b1d}
body[data-theme=magic] .fg-stage{background:linear-gradient(180deg,#1d1640 0%,#4b3a7a 60%,#b48fb8 100%)}
pre.blocks{font-family:ui-monospace,monospace;font-size:.8rem;white-space:pre-wrap;color:var(--mute);margin:8px 0 0}
.blockbox{background:#f7f5ef;border:1px solid #8a6d2f;border-radius:4px;padding:8px 10px;margin-top:8px;overflow-x:auto;line-height:1}
.blockbox svg{max-width:none}
.steps{list-style:none;padding:0;margin:0;counter-reset:st}
.steps>li{counter-increment:st;position:relative;padding:10px 12px 10px 48px;margin:8px 0;background:var(--panel2);border:1px solid rgba(168,178,180,.2);border-radius:4px}
.steps>li::before{content:counter(st);position:absolute;left:10px;top:10px;width:26px;height:26px;background:linear-gradient(180deg,#f0d896,#c49a45);color:#1a1306;font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--serif)}
details.tip{margin-top:8px}
details.tip summary{cursor:pointer;color:var(--jade);font-weight:700;width:max-content}
details.tip div{margin-top:4px;padding:6px 10px;border-left:3px solid var(--jade);background:rgba(127,224,191,.08);border-radius:0 4px 4px 0}
.example{background:rgba(127,224,191,.08);border:1px solid rgba(127,224,191,.5);border-radius:4px;padding:8px 12px;margin-top:8px}
.howto{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.howto span{background:rgba(5,10,18,.6);border:1px solid rgba(127,224,191,.35);border-radius:999px;padding:4px 10px;font-size:.9rem}
.tabs{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.tabs .btn.on{background:var(--jade)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">算衍修仙錄</span><small>積木計算篇・宜蘭競賽版</small></div>
  <div class="status">
    <span class="badge" id="realmBadge">凡人</span>
    <div class="xpbar" title="本境界進度"><div id="xpFill"></div></div>
    <span class="xptext" id="xpText">修為 0</span>
  </div>
  <nav>
    <button class="btn small" data-act="char">道基</button>
    <button class="btn small" data-act="scrolls">功法</button>
    <button class="btn small ghost" data-act="help">玩法</button>
    <button class="btn small ghost" data-act="world">換世界</button>
    <button class="btn small" data-act="savep">存檔</button>
  </nav>
</header>
<main>
  <div id="mapWrap" aria-label="仙界地圖：坊市、傳送驛站、靈田谷、藏經閣、演武場、靈舟渡口、宗門大比、天機閣、問道峰"><div id="scene3d"></div><div id="labels"></div><div id="fallback" hidden></div></div>
  <p class="hint">點仙島御劍前往；拖曳旋轉視角、滾輪或雙指縮放；也可用方向鍵移動、按 Enter 進入。</p>
</main>
<footer><a href="#elder">長老專區</a></footer>
<div id="overlay" class="hidden"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="forge" class="hidden" role="dialog" aria-modal="true" aria-label="修煉室">
  <div class="fg-top">
    <div class="fg-title"><span id="fgTag"></span><b id="fgName"></b><span class="sub" id="fgOrder"></span></div>
    <div class="modesw" role="group" aria-label="積木模式"><button type="button" data-fg="mode" data-m="Scratch">Scratch</button><button type="button" data-fg="mode" data-m="Blockly">Blockly</button></div>
    <button class="btn small ghost" data-fg="xml" title="下載後可在比賽平台按「上傳 XML」載入">下載 XML</button>
    <button class="btn small ghost" data-fg="guide">步驟與提示</button>
    <button class="btn small ghost" data-fg="back">返回任務</button>
  </div>
  <div class="fg-body">
    <aside class="fg-guide" id="fgGuide"></aside>
    <div class="fg-ws"><div id="fgWs"></div><div id="fgLoading">修煉室開啟中……第一次需要載入競賽用的 Blockly 積木，請稍等。</div></div>
    <aside class="fg-side">
      <div class="fg-stage"><div class="fg-run" id="fgRun"></div><div class="fg-bubble" id="fgBubble" hidden></div>

/* ===================== 進度存檔 ===================== */
const SAVE='suanyan-v1';
const fresh=()=>({name:'',xp:0,cleared:[],quests:{},stats:Object.fromEntries(STATS.map(s=>[s,0])),titles:[],hints:{},notes:{},seen:{},pos:0});
let S;
try{S=JSON.parse(localStorage.getItem(SAVE))||fresh();}catch(e){S=fresh();}
S=Object.assign(fresh(),S);S.theme=THEME_ID;
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}}
function addStat(k,v){S.stats[k]=(S.stats[k]||0)+v;}
function addTitle(t){if(!S.titles.includes(t)){S.titles.push(t);toast('獲得稱號：'+t);}}
const unlocked=i=>i===0||S.cleared.includes(i-1);

function stageInfo(){
  const c=S.cleared.length,realm=RL(c),next=NODES[c];
  if(!next||!next.impl)return{realm,stage:'圓滿',frac:1};
  const qs=next.quests.filter(q=>q.type!=='extra');
  const done=qs.filter(q=>S.quests[q.id]).length+(S.notes[next.id+'.order']?1:0);
  const f=done/(qs.length+1);
  return{realm,stage:f<1/3?'初期':f<2/3?'中期':'後期',frac:f};
}
function updateHud(){
  const s=stageInfo();
  document.getElementById('realmBadge').textContent=TX(s.realm+' · '+s.stage);
  document.getElementById('xpFill').style.width=Math.round(s.frac*100)+'%';
  document.getElementById('xpText').textContent=(S.name?S.name+' · ':'')+TX('修為 ')+S.xp;
}

/* ===================== 地圖（3D 場景在下方的模組裡） ===================== */
function walkTo(i,open){if(window.Map3D)Map3D.walkTo(i,open);else{S.pos=i;save();if(open)openRegion(i);}}
function tryGo(i){
  if(!NODES[i].impl){toast('「'+NODES[i].name+'」將在下一版開放。');return;}
  if(!unlocked(i)){toast('仙島封印中：要先突破前一個境界，才能前往「'+NODES[i].name+'」。');return;}
  walkTo(i,true);
}
window.tryGo=tryGo;
function renderFallback(){const f=document.getElementById('fallback');
  f.innerHTML=TX('<p>3D 場景載入中，或此裝置不支援 3D。也可以直接點下面的地點：</p><div class="row">'+NODES.map((n,i)=>`<button class="btn small ${unlocked(i)&&n.impl?'':'ghost'}" onclick="tryGo(${i})">${n.name}${S.cleared.includes(i)?' ✓':''}</button>`).join('')+'</div>');}
function mapRefresh(){if(window.Map3D)Map3D.refresh();renderFallback();}
document.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229)return;
  if(e.target.closest&&e.target.closest('input,textarea,[contenteditable]'))return;
  if(!document.getElementById('forge').classList.contains('hidden'))return;
  if(!document.getElementById('overlay').classList.contains('hidden')){if(e.key==='Escape')closePanel();return;}
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  const p=S.pos||0,busy=window.Map3D&&Map3D.busy();
  if(['ArrowRight','ArrowDown'].includes(e.key)){const n=p+1;if(n<NODES.length){if(NODES[n].impl&&unlocked(n))walkTo(n,false);else toast(!NODES[n].impl?'下一座仙島尚未開放。':'要先突破這個境界。');}e.preventDefault();}
  if(['ArrowLeft','ArrowUp'].includes(e.key)){if(p>0)walkTo(p-1,false);e.preventDefault();}
  if(e.key==='Enter'){if(!busy)openRegion(p);e.preventDefault();}
});

/* ===================== 面板 ===================== */
const ov=document.getElementById('overlay'),pn=document.getElementById('panel');
let cur=null;
function renderBlocks(){renderSnips(pn);}
function showPanel(html,keep){const top=pn.scrollTop;pn.innerHTML='<button class="btn small ghost close" data-act="close">關閉</button>'+TX(html);ov.classList.remove('hidden');pn.scrollTop=keep?top:0;renderBlocks();}
function closePanel(){ov.classList.add('hidden');cur=null;updateHud();if(location.hash==='#elder')history.replaceState(null,'',location.pathname+location.search);}
ov.addEventListener('click',e=>{if(e.target===ov)closePanel();});
let toastTimer;
function toast(m){const t=document.getElementById('toast');t.textContent=TX(m);t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}

function openRegion(i){
  const n=NODES[i];if(!n.impl||!unlocked(i))return;
  cur={i,view:S.seen[n.id]?'board':'dialog',dlg:0,trial:null,msg:''};renderRegion();
}
function questReady(n,q){
  if(!S.notes[n.id+'.order'])return false;
  const k=n.quests.indexOf(q);
  return n.quests.slice(0,k).every(x=>S.quests[x.id]);
}
function renderRegion(){
  const n=NODES[cur.i];let h=`<h2>${n.name}</h2><p class="sub">突破條件：斬除心魔、取回玉簡，踏入${n.realm}</p>`;
  if(cur.view==='dialog'){
    h+=`<div class="dialog"><div class="speaker">${n.npc}</div><div>${n.lines[cur.dlg]}</div></div>
      <div class="row"><button class="btn" data-act="dlgNext">${cur.dlg<n.lines.length-1?'下一句':'接下委託'}</button><button class="btn ghost" data-act="dlgSkip">跳過對話</button></div>`;
  }else if(cur.view==='trial'){h+=renderTrial(n);}
  else{
    if(cur.msg)h+=`<div class="msg ${cur.msgType||'info'}">${cur.msg}</div>`;
    const ord=S.notes[n.id+'.order'];
    if(!ord){
      const ex=ORDER_EX[n.id]||ORDER_EX.r1;
      h+=`<h3>第一步：填寫委託符</h3><p class="sub">動手寫程式前，先想清楚三件事：輸入什麼、怎麼算、輸出什麼。下面已經幫你寫好提示，看一看就可以直接按「確定」；想用自己的話改寫也可以。完成可得修為 ${XP.order}、神識 +1。</p>
      <form data-form="order">
      <div class="field"><label>使用者會輸入什麼？</label><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" name="i" value="${ex[0]}"></div>
      <div class="field"><label>程式要怎麼處理？</label><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" name="p" value="${ex[1]}"></div>
      <div class="field"><label>最後要輸出什麼？</label><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" name="o" value="${ex[2]}"></div>
      <div class="row"><button class="btn" type="submit">確定</button><button class="btn ghost" type="button" data-act="replay">重看對話</button></div></form>`;
    }else{
      h+=`<h3>修行任務</h3>`;
      n.quests.forEach(q=>{const done=S.quests[q.id],ready=questReady(n,q);
        h+=`<div class="quest ${done?'done':''} ${!ready&&!done?'locked':''}"><div class="info"><span class="tag ${q.type}">${TYPE_NAME[q.type]}</span><span class="name">${q.title}</span>${done?' <span style="color:var(--ok)">✓ 完成</span>':''}<div class="sub" style="margin:2px 0 0">${MX(q.desc)}</div></div>
        <button class="btn small" data-act="trial" data-q="${q.id}" ${ready?'':'disabled'}>${done?'再練一次':'開始試煉'}</button></div>`;});
      h+=`<p class="sub">這一區是同一個法器一路往下做：任務要依序完成，每一題都接著上一題的積木往下改；斬除心魔後會出現奇遇加碼。修煉室會自動保留你的積木和變數。</p>`;
      const boss=n.quests.find(q=>q.type==='boss');
      if(S.cleared.includes(cur.i)){h+=`<div class="msg ok">已取回「${n.name}玉簡」，踏入${n.realm}。</div>
        <h3>延伸修行：上比賽平台實戰</h3><p class="sub">用下面的「競賽對照」挑一題，到比賽平台用一樣的積木寫寫看，按「評分」拿到 100 分才算過關。</p>`;}
      else if(S.quests[boss.id]){
        const jn=S.notes[n.id+'.journal'];
        h+=`<h3>最後一步：修行心得與長老印記</h3>`;
        if(!jn){const je=JOURNAL_EX[n.id]||JOURNAL_EX.r1;h+=`<p class="sub">把這一區的程式寫成心得（程式說明文件簡易版）。下面已經幫你寫好，看一看就可以直接按「確定」；想加上自己的話也可以刪改。完成可得修為 ${XP.journal}、根基與神識各 +1。</p>
          <form data-form="journal">
          <div class="field"><label>我用了哪些變數？各存什麼？</label><textarea autocapitalize="off" spellcheck="false" name="v" rows="2">${je[0]}</textarea></div>
          <div class="field"><label>程式的流程（先做什麼、再做什麼）</label><textarea autocapitalize="off" spellcheck="false" name="f" rows="2">${je[1]}</textarea></div>
          <div class="field"><label>我測了哪些輸入？發現並修正了什麼錯誤？</label><textarea autocapitalize="off" spellcheck="false" name="t" rows="2">${je[2]}</textarea></div>
          <button class="btn" type="submit">確定</button></form>`;}
        else{h+=`<p class="sub">請長老（老師）檢查你的作品與心得，取得長老印記後輸入。</p>
          <form data-form="seal" class="row"><input type="text" name="code" placeholder="長老印記" style="max-width:220px" autocomplete="off"><button class="btn" type="submit">突破境界</button></form>`;}
      }
      h+=ictHTML(n.id)+`<div class="row"><button class="btn ghost small" data-act="replay">重看對話</button></div>`;

  showPanel(h);

}else{const sword=new THREE.Group();sword.add(box(.22,.05,2.4,M(0xdfe8ee,{metalness:.8,roughness:.25,emissive:0x2f7f8f,emissiveIntensity:.5}),0,0,.2));
 const tip=mesh(new THREE.ConeGeometry(.11,.35,4),M(0xdfe8ee,{metalness:.8,roughness:.25}),0,0,1.57);tip.rotation.x=Math.PI/2;sword.add(tip);
 sword.add(box(.6,.08,.1,M(C.gold),0,0,-1));sword.add(box(.08,.08,.5,M(0x5a2e1e),0,0,-1.3));hero.add(sword);
 const body=new THREE.Group();body.add(mesh(new THREE.ConeGeometry(.42,1.25,10),M(0xf3f0e8),0,.68,0));body.add(rot(mesh(new THREE.TorusGeometry(.24,.05,6,12),M(0x3fa58c),0,.85,0),Math.PI/2));
 body.add(mesh(new THREE.SphereGeometry(.24,12,10),M(0xf1c9a0),0,1.5,0));body.add(mesh(new THREE.SphereGeometry(.25,12,10,0,Math.PI*2,0,Math.PI/2),M(0x1d1d22),0,1.53,-.02));
 body.add(mesh(new THREE.SphereGeometry(.12,8,6),M(0x1d1d22),0,1.8,-.05));
 const sash=mesh(new THREE.PlaneGeometry(.12,1.1),new THREE.MeshStandardMaterial({color:0x6fe0bf,side:THREE.DoubleSide,emissive:0x1b6b58}),0,1,-.45);sash.rotation.x=.6;body.add(sash);anim.sash=sash;
 hero.add(body);hero.scale.setScalar(1.15);}
const TRAIL=48,trailPos=new Float32Array(TRAIL*3);const trailGeo=new THREE.BufferGeometry();trailGeo.setAttribute('position',new THREE.BufferAttribute(trailPos,3));
const trail=new THREE.Line(trailGeo,new THREE.LineBasicMaterial({color:MAGIC?0xffe9a8:0x9ff6dc,transparent:true,opacity:.75}));scene.add(trail);
const trailPts=[];

/* ---------- 標籤 ---------- */
const labels=NODES.map(n=>{const d=document.createElement('div');d.className='lbl';labelsEl.appendChild(d);return d;});

/* ---------- 狀態 ---------- */
const cam={target:new THREE.Vector3()};
const controls=new OrbitControls(camera,renderer.domElement);
controls.enablePan=false;controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=9;controls.maxDistance=48;controls.maxPolarAngle=1.38;controls.minPolarAngle=.35;
let moving=null,queue=[],openAfter=false,heading=0;
function placeAt(i){const h=hover(i);hero.position.copy(h);cam.target.copy(h);controls.target.copy(h);camera.position.copy(h).add(new THREE.Vector3(9,11,22));trailPts.length=0;}
placeAt(S.pos||0);
function targetIdx(){for(let i=0;i<NODES.length;i++)if(!S.cleared.includes(i))return i;return -1;}
function refresh(){
  islands.forEach((g,i)=>{const locked=!unlocked(i)||!NODES[i].impl,r=g.userData.refs;r.bubble.visible=locked;r.seal.visible=locked;r.done.visible=S.cleared.includes(i);
    const n=NODES[i],l=labels[i],cleared=S.cleared.includes(i);
    l.className='lbl'+(locked?' locked':'')+(cleared?' done':'');
    l.innerHTML=TX(`${n.name}<small>${cleared?'已突破':n.impl?(locked?'封印中 · 突破'+n.realm:'突破'+n.realm):'下一版開放'}</small>`);});
  segs.forEach((s,i)=>{const lit=unlocked(i+1)&&NODES[i+1].impl;s.tube.material.color.set(lit?(MAGIC?0xffe08a:0x8ff5d6):0x8d99a6);s.tube.material.opacity=lit?.85:.25;});
  const t=targetIdx();pillar.visible=t>=0&&unlocked(t)&&NODES[t].impl;if(pillar.visible){pillar.position.copy(POS[t]);pillar.position.y+=20;}
}
function walkTo(i,open){
  if(moving||queue.length)return;const from=S.pos||0;
  if(i===from){if(open)openRegion(i);return;}
  const st=i>from?1:-1;for(let k=from+st;k!==i+st;k+=st)queue.push(k);openAfter=!!open;
}
function startNext(){const from=S.pos||0,to=queue.shift();const fwd=to>from,s=segs[Math.min(from,to)];moving={from,to,s,fwd,t:0};}
function reset(){moving=null;queue=[];placeAt(0);refresh();}

/* ---------- 互動 ---------- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
function pick(e){const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(islands,true)[0];if(!hit)return -1;let o=hit.object;while(o&&o.userData.idx===undefined)o=o.parent;return o?o.userData.idx:-1;}
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const d=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(d>6)return;
  const i=pick(e);if(i<0)return;window.tryGo(i);});
let hoverIdx=-1;
renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons)return;const i=pick(e);if(i!==hoverIdx){if(hoverIdx>=0)labels[hoverIdx].classList.remove('hot');hoverIdx=i;if(i>=0)labels[i].classList.add('hot');renderer.domElement.style.cursor=i>=0?'pointer':'grab';}});

/* ---------- 尺寸 ---------- */
function resize(){const w=wrap.clientWidth,h=Math.max(340,Math.min(640,Math.round(w*(w<640?1.05:.6))));renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();wrap.style.height=h+'px';}
new ResizeObserver(resize).observe(wrap);resize();

/* ---------- 迴圈 ---------- */
const clock=new THREE.Clock(),tmp=new THREE.Vector3(),prevT=new THREE.Vector3();
const ovEl=document.getElementById('overlay'),fgEl3=document.getElementById('forge'),burstEl=document.getElementById('burst');
function frame(){
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  // 面板、修煉室或輸入框開著時暫停 3D，讓手機打字不卡、不吃字
  const ae=document.activeElement;
  if(!moving&&!queue.length&&(!ovEl.classList.contains('hidden')||!fgEl3.classList.contains('hidden')||burstEl.classList.contains('show')||document.hidden||(ae&&/INPUT|TEXTAREA/.test(ae.tagName)))){requestAnimationFrame(frame);return;}
  if(!moving&&queue.length)startNext();
  if(moving){const m=moving;m.t+=dt*10/m.s.len;const u=Math.min(1,m.t),p=m.s.curve.getPoint(m.fwd?u:1-u);
    const tan=m.s.curve.getTangent(m.fwd?u:1-u);if(!m.fwd)tan.negate();heading=Math.atan2(tan.x,tan.z);hero.position.copy(p);
    trailPts.push(p.clone());if(trailPts.length>TRAIL)trailPts.shift();
    if(m.t>=1){S.pos=m.to;moving=null;save();if(!queue.length&&openAfter){openAfter=false;openRegion(S.pos);}}}
  else{const h=hover(S.pos||0);hero.position.set(h.x,h.y+Math.sin(t*2)*.12,h.z);if(trailPts.length)trailPts.shift();heading+=(0-heading)*.03;}
  hero.rotation.y=heading;hero.rotation.z=moving?Math.sin(t*6)*.05:Math.sin(t*1.5)*.03;
  for(let k=0;k<TRAIL;k++){const q=trailPts[Math.max(0,trailPts.length-TRAIL+k)]||hero.position;trailPos[k*3]=q.x;trailPos[k*3+1]=q.y-.05;trailPos[k*3+2]=q.z;}
  trailGeo.attributes.position.needsUpdate=true;trail.visible=trailPts.length>1;
  prevT.copy(cam.target);cam.target.lerp(tmp.copy(hero.position).add(new THREE.Vector3(0,.6,0)),.06);
  camera.position.add(tmp.copy(cam.target).sub(prevT));controls.target.copy(cam.target);controls.update();
  clouds.rotation.y=t*.006;motes.rotation.y=t*.02;motes.position.y=Math.sin(t*.3)*.6;
  if(anim.portal)anim.portal.material.opacity=.3+.2*Math.sin(t*3);
  if(anim.orb){anim.orb[0].rotation.y=t*1.2;anim.orb[1].rotation.z=t*.9;}
  if(anim.boat){anim.boat.position.y=.7+Math.sin(t*1.6)*.15;anim.boat.rotation.z=Math.sin(t*1.2)*.04;}
  if(anim.flag)anim.flag.rotation.y=Math.sin(t*3)*.25;
  if(anim.peak)anim.peak.material.opacity=.18+.1*Math.sin(t*2);
  if(anim.books)anim.books.rotation.y=t*.5;
  if(anim.orbStars)anim.orbStars.rotation.y=t*.4;
  if(anim.wings)anim.wings.forEach((w,k)=>w.rotation.x=(k?-1:1)*(.6+Math.sin(t*4)*.25));
  if(anim.sash)anim.sash.rotation.x=.6+Math.sin(t*5)*.15+(moving?.5:0);
  pillar.material.opacity=.14+.1*Math.sin(t*3);
  islands.forEach(g=>{const r=g.userData.refs;if(r.seal.visible)r.seal.rotation.z=t*.3;});
  const W=renderer.domElement.clientWidth,H=renderer.domElement.clientHeight;
  labels.forEach((l,i)=>{tmp.copy(POS[i]);tmp.y+=i===8?8.2:i===7?6.8:i===3?5:4.3;tmp.project(camera);
    if(tmp.z>1){l.style.display='none';return;}l.style.display='';l.style.left=((tmp.x+1)/2*W)+'px';l.style.top=((1-tmp.y)/2*H)+'px';});
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
refresh();frame();
window.Map3D={walkTo,refresh,reset,busy:()=>!!moving||queue.length>0};
document.getElementById('fallback').hidden=true;

</script>
</body>
</html>
